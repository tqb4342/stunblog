# ---------------------------------------------------------------
# Stun 主题配置（AI 冲浪指南定制版）
# 完整默认配置复制到站点根目录，升级主题不丢配置（官方推荐做法）
# 主题文档: https://theme-stun.github.io/docs/zh-CN/

# ---------------------------------------------------------------
# Theme Core Configuration Settings

# Remove unnecessary files after hexo generate.
shake_file: true

# SEO Settings

# If true, will add site-subtitle to index page.
index_subtitle: true

# Set a canonical link tag for your Hexo site.
canonical: true

# Webmaster tools verification setting
google_site_verification:
bing_site_verification:
baidu_site_verification: codeva-llE2rPA78x
qihu360_site_verification:
sougou_site_verification:

# Menu config

menu:
  home: / || fas fa-home
  archives: /archives/ || fas fa-folder-open
  about: /about/ || fas fa-user
  # categories: /categories/ || fas fa-layer-group
  # tags: /tags/ || fas fa-tags

submenu:

menu_settings:
  icon_only: false
  text_only: false

# Site config

favicon:
  small: /images/icons/aisurf-favicon-16x16.png
  medium: /images/icons/aisurf-favicon-32x32.png

# Progressive Web Apps
pwa:
  enable: false
  manifest: /manifest.json
  theme_color: '#54bcff'

# Night mode（日/夜切换，跟随系统 + 手动开关）
night_mode:
  enable: true
  button:
    color: '#fafafa'
    bg_color: '#8c8a8a'
  icon:
    dark: 🌜
    light: 🌞

# The layout for sidebar and content of site.
layout:
  content: 768px
  sidebar: 300px
  content_sidebar_gap: 30px
  main_padding:
    default: 20px
    tablet: 15px
    mobile: 10px

# The header of site.
header:
  enable: true
  # 文章页不显示大 banner（只留导航条，正文顶到最上面）；首页/归档页保留
  show_on:
    post: false
  # banner 背景图（站内本地，Cloudflare CDN 分发）
  # 高度按屏幕高度百分比计算，仅作用于首页/归档页
  height: 80%
  bg_image:
    enable: true
    url: /images/banner.webp
  banner:
    enable: true
    title: AI 冲浪指南
    subtitle: 工具实测与网络实践
  mask:
    enable: false
    opacity: 0.5
  nav:
    height: 50px
    bg_color: '#2d2e30'
  scroll_down_icon:
    enable: false
    name: fas fa-angle-down
    animation: true

# The body of site.
body:
  bg_image:
    enable: false
    url:
    fixed: true
    repeat: false
  mask:
    enable: false
    opacity:
      default: 0.1
      night_mode: 0.6

# The footer of site.
footer:
  bg_image:
    enable: false
    url:
  mask:
    enable: false
    opacity: 0.5
  copyright:
    enable: true
    text:
    since: 2026
    end:
  icon:
    enable: true
    name: fas fa-heart
    animation: false
    color: '#ff0000'
  powered:
    enable: true
    version: true
  theme:
    enable: true
    version: true
  beian:
    enable: false
    icp:
  # 自定义 footer 注入：utterances 评论框配色跟随夜间模式（脚本无 UI，div 不可见）
  custom:
    enable: true
    text: |-
      <script>
      (function(){
        var t;
        function sync(){
          var f=document.querySelector(".utterances-frame");
          if(!f)return;
          var d=document.documentElement.classList.contains("nightmode");
          f.contentWindow.postMessage({type:"set-theme",theme:d?"github-dark":"github-light"},"https://utteranc.es");
        }
        function retry(n){sync();if(n>0)setTimeout(function(){retry(n-1);},700);}
        new MutationObserver(function(){clearTimeout(t);t=setTimeout(sync,50);}).observe(document.documentElement,{attributes:true,attributeFilter:["class"]});
        window.addEventListener("load",function(){retry(4);});
      })();
      </script>

# Creative Commons 4.0 International License
creative_commons:
  enable: true
  license: BY-NC-SA
  sidebar: true
  post: true
  language: zh

# Back to top
back2top:
  enable: true
  icon:
    name: fas fa-rocket
    rotate: -45deg
    color: '#49b1f5'
    hover_color: '#fc6423'

# Sidebar config

sidebar:
  enable: true
  position: right
  offsetTop: 20px
  horizon_line: false

author:
  enable: true
  avatar:
    url: /images/aisurf-avatar.png
    rounded: true
    opacity: 1
    animation: turn
  motto: 写过、用过、踩过坑之后才落笔

# Social links（按需启用）
social:
  # github: https://github.com/ || fab fa-github
  # weibo: https://weibo.com/ || fab fa-weibo
  # zhihu: https://www.zhihu.com/ || origin:知
  # telegram: yournumber || fab fa-telegram

social_setting:
  enable: true
  icon_only: true

# Table Of Contents in the Sidebar.
toc:
  enable: true
  list_number: true
  wrap: true
  expand_all: false
  min_depth: 1
  max_depth: 6

# Subscribe of email and rss.
feed:
  enable: true
  email:
  rss: /rss.xml

# The reading progress of post.
reading_progress:
  enable: true
  color: '#fc6423'
  height: 1px

# Page config

codeblock:
  # carbon = 顶部带 Mac 红黄绿三圆点（carbon.now.sh 风格）
  # 注意：仅支持 default | simple | carbon，写别的值会静默回退 default
  style: carbon
  highlight: light
  word_wrap: false

# Add a line below h1, h2 tags.
heading_line: true

# Reward QR Code
reward:
  enable: false
  alipay:
  wechat:

# Post config

post_meta:
  # 图标模式：只显示 图标+数值，悬停显示全称（配合单行紧凑排版）
  icon_only: true
  created:
    enable: true
    icon: far fa-calendar-plus
  # 更新时间与发表同天时纯冗余，关闭；以后大改旧文想显示可改回 true
  updated:
    enable: false
    icon: far fa-calendar-check
  reading_time:
    enable: true
    icon: far fa-clock
    speed:
      zh: 200
      en: 80
  word_count:
    enable: true
    icon: far fa-file-word

post_list:
  paginate:
    home: true
    archives: false
  cover_image:
    home: false

post_widget:
  tags: true
  end_text:
    enable: true
    horizon_line: true
  share:
    enable: true
    label: '分享到：'
    target: qzone, qq, weibo, wechat, douban, linkedin, facebook, twitter

stick_top:
  position: right
  icon: fas fa-thumbtack
  rotate: 45deg
  color: '#999'

# Comment config（需要时再启用）
gitalk:
  enable: false
  owner:
  repo:
  client_id:
  client_secret:
  admin:
  distraction_free_mode: false
  language:

waline:
  enable: false
  serverURL:
  placeholder: Just go go
  avatar: mp
  meta: nick,mail,link
  pageSize: 10
  lang: zh-CN,zh-TW,en
  visitor: false

valine:
  enable: false
  appid:
  appkey:
  notify: true
  verify: true
  placeholder: Just go go
  avatar: mp
  meta: nick,mail,link
  pageSize: 10
  visitor: false
  recordIP: false
  language:

minivaline:
  enable: false
  appId:
  appKey:
  placeholder: Write a Comment
  adminEmailMd5:
  math: true
  md: true
  lang:

livere:
  enable: false
  uid:

disqus:
  enable: false
  shortname:
  count: true

utterances:
  enable: true
  owner: tqb4342
  repo: stunblog
  # pathname 按 URL 匹配评论（改标题不丢评论）；title 会随标题改动丢失关联
  mapping: pathname
  label: utterances
  theme: github-light
  script_url: https://utteranc.es/client.js

fbcomments:
  enable: false
  appId:
  lang: en_US
  numPosts: 10
  order_by: reverse_time
  lazy: true
  mobile: true
  width: 100%

# Statistics and Analytics config

busuanzi:
  # 只复用 Stun 的文章阅读数展示位（meta 区 👁 图标 + 数字）
  # 统计脚本已通过下方 cdn.busuanzi 覆盖为本站 /js/pv.js（自建 KV 计数，不用不蒜子服务）
  enable: true
  icon_only: false
  site_uv:
    enable: false
    icon: fas fa-user
  site_pv:
    enable: false
    icon: fas fa-eye
  post_pv:
    enable: true
    icon: fas fa-eye

google_analytics:

baidu_analytics: c84ec9a787275871d3ffded786c3c5af

# Search config

algolia_search:
  enable: false
  hits:
    per_page: 10
  labels:
    show_stats: true

local_search:
  enable: true

assist_search:
  enable: false
  google: true
  bing: true
  baidu: true

# Background config

canvas_ribbon:
  enable: false
  size: 120
  alpha: 0.6
  zIndex: -1

canvas_nest:
  enable: false
  color: '0,0,0'
  opacity: 0.6
  count: 99
  zIndex: -1

# Math and Chart config
math:
  enable: false
  per_page: false
  engine: katex
  mathjax:
    cdn: https://cdn.jsdelivr.net/npm/mathjax/MathJax.js?config=TeX-AMS-MML_HTMLorMML
    mhchem:
      enable: false
      mhchem_js: https://cdn.jsdelivr.net/npm/mathjax-mhchem@3.3.2/mhchem.min.js
  katex:
    cdn: https://cdn.jsdelivr.net/npm/katex@0.10.2/dist/katex.min.css
    copy_tex:
      enable: true
      copy_tex_js: https://cdn.jsdelivr.net/npm/katex@0.10.2/dist/contrib/copy-tex.min.js
      copy_tex_css: https://cdn.jsdelivr.net/npm/katex@0.10.2/dist/contrib/copy-tex.css

# Other config

fancybox: false

zoom_image:
  enable: true
  mask_color: 'rgba(0,0,0,0.6)'
  gap_aside: 20px

gallery_waterfall:
  enable: false
  col_width: 220px
  gap_x: 10px
  gap_y: 10px

lazyload:
  enable: true
  placeholder: gif

quicklink:
  enable: true
  home: true
  archive: true
  delay: true
  timeout: 10000
  priority: true
  ignores:
    - /\/api\/?/
    - uri => uri.includes('.xml')
    - uri => uri.includes('.zip')
    - (uri, el) => el.hasAttribute('nofollow')
    - (uri, el) => el.hasAttribute('noprefetch')

pjax:
  enable: false
  avoid_banner: false
  elements:
  selectors:
  switches:
  switchesOptions:
  history: true
  scrollTo: false
  scrollRestoration: false
  cacheBust: false
  debug: false
  currentUrlFullReload: false
  timeout: 0

google_adsense:
  enable: false
  client:
  js_src: https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js

external_link:
  icon:
    enable: true
    name: fas fa-external-link-alt
    color: '#aaa'

shortcuts:
  switch_post:
    enable: false

tag_cloud:
  start_color: '#a4d8fa'
  end_color: '#49b1f5'
  min_size: 16
  max_size: 26
  max_amount: 200

kill_old_ie:
  enable: false
  warning_url: https://support.dmeng.net/upgrade-your-browser.html

