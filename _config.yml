# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: AI 冲浪指南
subtitle: 工具实测与网络实践
description: AI 冲浪指南：AI 工具实测与网络冲浪实践笔记，亲手用过、踩过坑才写下来。
keywords: AI工具,工具实测,网络冲浪,冲浪指南
author: 冲浪客
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://aisurf.cc
root: /
# 文章直接挂根路径：/文章名/；注意文章名别撞 about/tags/archives/categories 这些保留路径
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
## Themes: https://hexo.io/themes/
theme: stun

# Sitemap（提交搜索引擎用）
sitemap:
  path: sitemap.xml
  rel: false
  tags: true
  categories: true

# Deployment
## 部署方式确定后再配置（Cloudflare Pages：build=npx hexo generate, output=public）
deploy:
  - type: ''
